name: lapbulterbul
description: "A new Flutter project."
publish_to: 'none'
version: 0.2.2-alpha+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  file_picker: ^8.3.7
  desktop_drop: 0.8.4
  cross_file: ^0.3.4+2
  pasteboard: ^0.6.0
  intl: ^0.19.0
  pdf: ^3.11.3
  printing: ^5.14.2
  image: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
